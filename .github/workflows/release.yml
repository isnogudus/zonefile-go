name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to build a release for, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: build
        run: |
          mkdir -p dist
          for t in openbsd/amd64 openbsd/arm64 freebsd/amd64 freebsd/arm64 \
                   linux/amd64 linux/arm64 linux/arm; do
            os=${t%/*}; arch=${t#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=6 \
              go build -ldflags="-s -w -X main.version=${TAG}" \
              -o dist/zonefile-go-${TAG}-$os-$arch .
          done
          cp zonefile-go.8 zonefile.conf.5 dist/
          cp examples/zones.conf dist/zonefile.conf.example
          (cd dist && sha256sum * > SHA256SUMS)
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes "Static binaries for OpenBSD, FreeBSD and Linux, the manual pages zonefile-go(8) and zonefile.conf(5), and an example configuration. Verify with SHA256SUMS."
