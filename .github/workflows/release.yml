name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to build a release for, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: build
        run: |
          mkdir -p dist
          for t in openbsd/amd64 openbsd/arm64 freebsd/amd64 freebsd/arm64 \
                   linux/amd64 linux/arm64 linux/arm; do
            os=${t%/*}; arch=${t#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=6 \
              go build -ldflags="-s -w -X main.version=${TAG}" \
              -o dist/zonefile-go-${TAG}-$os-$arch .
          done
          cp zonefile-go.8 zonefile.conf.5 dist/
          cp examples/zones.conf dist/zonefile.conf.example
      - name: archives for /usr/local
        run: |
          for os in openbsd freebsd; do
            for arch in amd64 arm64; do
              make dist-$os DIST_ARCH=$arch VERSION="$TAG"
            done
          done
          # Every file in the archives must belong to root.
          for f in dist/*.tgz; do
            bad=$(tar -tvzf "$f" | awk '$2 != "0/0" && $2 != "root/root" && $2 != "root/wheel"')
            if [ -n "$bad" ]; then
              echo "$f: files not owned by root:"; echo "$bad"; exit 1
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes "Archives for OpenBSD and FreeBSD with the binary, the manual pages and the example configuration, to unpack with tar -xzf FILE -C /usr/local. Also static binaries for OpenBSD, FreeBSD and Linux, the manual pages zonefile-go(8) and zonefile.conf(5), and an example configuration. Verify with SHA256SUMS."
