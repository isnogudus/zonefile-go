email hostmaster@example.com
serial 2026100400
nameserver ns1.example.com.

reverse { 192.0.2.0/24 2001:db8::/64 }

dhcp {
	not authoritative
	option domain-search example.com
	option ntp-servers .1
	max-lease-time 1d
}

dhcp 192.0.2.0/24 {
	server-identifier .1
	authoritative
	get-lease-hostnames false
	option smtp-server .3
	option autoproxy-script "http://wpad.example.com/wpad.dat"
	range .100 .150
	option routers .1
	option domain-name-servers { .1 .2 }
	option domain-name example.com
	default-lease-time 1h

	dhcp-profile filtered {
		option domain-name-servers .53
		default-lease-time 30m
	}
}

zone example.com {
	network { 192.0.2.0/24 2001:db8::/64 }
	nameserver ns2.example.com. ttl 1d
	mx mail priority 10
	mx backup-mx.example.net. priority 20 ttl 2h

	host @    .1 alias ns1
	host www  .2 alias { ftp ns2 very-long-alias-name-for-column-tests } ttl 5m
	host mail .3 no inet6 mac { 00:00:5e:00:53:03 00:00:5e:00:53:04 } dhcp
	host tv   .20 no inet6 mac 00:00:5e:00:53:14 dhcp dhcp-profile filtered

	srv _imaps._tcp mail port 993 priority 0 weight 1
	cname webmail www ttl 1h
}
