set email hostmaster@example.com
set serial 2026100400
nameserver ns1.example.com.

reverse { 192.0.2.0/24 2001:db8::/64 }

zone example.com {
	network { 192.0.2.0/24 2001:db8::/64 }
	nameserver ns2.example.com. ttl 1d
	mx mail priority 10
	mx backup-mx.example.net. priority 20 ttl 2h

	host @    .1
	host www  .2 alias { ftp very-long-alias-name-for-column-tests } ttl 5m
	host mail .3 no inet6

	srv _imaps._tcp mail port 993 priority 0 weight 1
	cname webmail www ttl 1h
}
