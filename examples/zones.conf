# zones.conf — the configuration of zonefile-rs/zones.yaml in
# zonefile.conf syntax. See docs/grammar.md.

lan = "{ 192.168.21.0/24 fd00:1234:5678:1000::/64 }"

email admin@example.com

nameserver ns1.example.com.
mx mail.example.com. priority 10

reverse {
	192.168.0.0/16
	fd00:1234:5678:1000::/64
	fd00:1234:5678:2000::/64
}

# dhcpd.conf for the LAN; zonefile-go -t dhcpd writes it. Hosts with a mac
# and dhcp get a fixed address there.
dhcp 192.168.21.0/24 {
	range .100 .199
	option routers .1
	option domain-name-servers .1
	option domain-name example.com
	option domain-search { example.com apps.example.com }
	option ntp-servers .1
	default-lease-time 1d
	max-lease-time 7d
}

zone internal.example.com {
	network $lan
	no ptr
	no mx

	host unifi .5 alias @ no inet6
}

zone apps.example.com {
	network $lan
	no ptr
	no mx

	host docker        .5 alias *
	host homeassistant .37
	host mail          .20
	host mcp           .2
	host proxmox       .2

	cname addresses radicale
	cname contacts  radicale
}

zone example.com {
	network $lan
	mx mail priority 10

	host gateway { 203.0.113.1 2001:db8::1 } no ptr
	host router .1 alias { @ dns mqtt ns1 ntp proxy time wpad www }

	host server1    .2
	host server2    .3
	host backup     .4
	host docker     .5
	host storage    .6
	host db         .7
	host service    .8
	host controller .10
	host archive    .11
	host printer    .12 no inet6 mac 00:00:5e:00:53:12 dhcp
	host adblock    .13

	host nas        .17
	host files      .18
	host mail       .20

	host bookmarks     .23 no inet6
	host homeassistant .37 no inet6

	host office_printer .200 mac { 00:00:5e:00:53:c8 00:00:5e:00:53:c9 } dhcp

	host ap2         .247 no inet6
	host switch2     .248 no inet6
	host switch0     .249 no inet6
	host switch1     .250 no inet6
	host main_switch .251 no inet6
	host ap1         .252 no inet6
	host ap0         .253 no inet6

	srv _caldavs._tcp     @    port 443
	srv _carddavs._tcp    @    port 443
	srv _mqtt._tcp        mqtt port 1883
	srv _mqtts._tcp       mqtt port 8883
	srv _secure-mqtt._tcp mqtt port 8883
}

zone dmz.example.com {
	network 192.168.114.0/24
	host db      .7
	host service .8

	host git      .100
	host auth     .101
	host ldap     .102
	host media    .103
	host vault    .104
	host rss      .105
	host calendar .106
	host storage  .107
}

zone iot.example.com {
	network 192.168.200.0/24
	host controller .13
	host automation .14
	host monitor    .15
}

zone devices.example.com {
	network 192.168.201.0/24
	host time .1 alias mqtt
	host ha   fd00:1234:5678:3000::1

	host light-office-ceiling  .100
	host thermostat-office     .101
	host light-bedroom-ceiling .102
	host light-living-ceiling  .103
	host thermostat-bath       .104
	host light-entrance        .105
	host light-bath-ceiling    .106

	host switch-01 .10
	host switch-02 .11
	host switch-03 .12

	host sensor-01 .20
	host sensor-02 .21
	host sensor-03 .22
	host sensor-04 .23
	host sensor-05 .24
	host sensor-06 .25
	host sensor-07 .26
	host sensor-08 .27
	host sensor-09 .28
	host sensor-10 .29
	host relay-01  .30
	host relay-02  .31
	host relay-03  .32
	host relay-04  .33
	host relay-05  .34
	host relay-06  .35

	host smoke-detector-01 .40
	host smoke-detector-02 .41
	host smoke-detector-03 .42
	host smoke-detector-04 .43

	host dimmer-01 .50

	host shutter-01 .60
	host shutter-02 .61
	host shutter-03 .62
	host shutter-04 .63
	host shutter-05 .64

	host plug-01 .70
	host plug-02 .71
	host plug-03 .72

	host input-module-01 .80
	host input-module-02 .81

	cname garage-light relay-01
}

# The IPv6 addresses of this zone used to copy the decimal digits
# (.67 -> ::67). With the uniform mapping they become ::43 and so on.
zone cluster.example.com {
	network { 192.168.93.0/24 fd00:1234:5678:2000::/64 }
	host node1 .1
	host node2 .2
	host node3 .3
	host node4 .4

	host mailserver .67
	host webserver  .68
	host appserver  .69
	host dbserver   .71
}
